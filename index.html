<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSL Intelligence Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── ANTHROPIC PALETTE ───────────────────────────────── */
    :root {
      --cream:        #FAF7F0;
      --cream-dark:   #F0EBE1;
      --charcoal:     #161210;
      --charcoal-mid: #2A2520;
      --terracotta:   #CC6847;
      --terra-lt:     #FDF2EC;
      --terra-dk:     #A8502E;
      --text:         #1A1511;
      --muted:        #7A6E65;
      --border:       #E5DFD5;
      --surface:      #FFFFFF;
      --radius:       10px;
      --shadow:       0 1px 3px rgba(22,18,16,.07), 0 2px 8px rgba(22,18,16,.04);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ──────────────────────────────────────────── */
    header {
      background: var(--charcoal);
      color: #fff;
      padding: 14px 20px;
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #2E2825;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
      background: var(--terracotta);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: #fff;
      letter-spacing: -.5px;
    }
    .header-title { font-size: 16px; font-weight: 700; color: #F5F0EA; }
    .header-sub   { font-size: 11px; color: #9E948A; margin-top: 1px; }
    .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #last-updated { font-size: 11px; color: #7A706A; }
    #refresh-btn {
      background: var(--charcoal-mid); color: #C8BEB4;
      border: 1px solid #3A3430; border-radius: 8px;
      padding: 6px 14px; font-size: 12px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      transition: background .15s, color .15s; font-family: inherit;
    }
    #refresh-btn:hover { background: #3A3430; color: #F0EBE1; }
    #refresh-btn svg { transition: transform .1s; flex-shrink: 0; }
    #refresh-btn.spinning svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TABS ────────────────────────────────────────────── */
    .tabs-wrap {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      position: sticky; top: 63px; z-index: 90;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tabs { display: flex; padding: 0 16px; min-width: max-content; }
    .tab {
      padding: 11px 15px; font-size: 13px; font-weight: 500;
      color: var(--muted); border-bottom: 2px solid transparent;
      cursor: pointer; white-space: nowrap;
      transition: color .15s, border-color .15s;
      display: flex; align-items: center; gap: 7px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--terracotta); border-bottom-color: var(--terracotta); }
    .tab-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .tab-count {
      background: var(--cream-dark); color: var(--muted);
      font-size: 10px; font-weight: 600;
      padding: 1px 5px; border-radius: 20px;
    }

    /* ── MAIN ────────────────────────────────────────────── */
    main { max-width: 1120px; margin: 0 auto; padding: 22px 16px 60px; }

    /* ── ALERTS ──────────────────────────────────────────── */
    .alert {
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .alert.visible { display: block; }
    .alert-warn { background: #FEF9EC; border: 1px solid #F0D98A; color: #7A5B0A; }
    .alert-info  { background: var(--terra-lt); border: 1px solid #F0C8B0; color: #7A3A1E; }

    /* ── STATUS ──────────────────────────────────────────── */
    #status {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 14px; display: none;
    }
    #status.visible { display: block; }
    .spinner {
      width: 30px; height: 30px; margin: 0 auto 14px;
      border: 3px solid var(--border);
      border-top-color: var(--terracotta);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    /* ── GRID ────────────────────────────────────────────── */
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

    /* ── CARD ────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 17px; display: flex; flex-direction: column; gap: 9px;
      transition: box-shadow .15s, transform .15s;
    }
    .card:hover { box-shadow: 0 4px 18px rgba(22,18,16,.10); transform: translateY(-1px); }
    .card-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .badge {
      font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 20px;
    }
    .card-src { font-size: 11px; color: var(--muted); margin-left: auto; font-weight: 500; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-title {
      font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text);
    }
    .card-title a { color: inherit; text-decoration: none; }
    .card-title a:hover { color: var(--terracotta); }
    .card-excerpt {
      font-size: 13px; color: var(--muted); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-foot {
      margin-top: auto; display: flex; align-items: center; justify-content: space-between;
      padding-top: 4px;
    }
    .card-date { font-size: 11px; color: var(--muted); }
    .read-link {
      font-size: 12px; font-weight: 600; color: var(--terracotta);
      text-decoration: none; display: flex; align-items: center; gap: 3px;
    }
    .read-link:hover { color: var(--terra-dk); }

    /* ── EMPTY ───────────────────────────────────────────── */
    .empty {
      grid-column: 1/-1; text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 14px;
    }
    .empty-icon { font-size: 32px; display: block; margin-bottom: 10px; }

    /* ── SECTION LABEL ───────────────────────────────────── */
    .section-label {
      grid-column: 1/-1;
      font-size: 11px; font-weight: 700; letter-spacing: .6px;
      text-transform: uppercase; color: var(--muted);
      padding: 8px 0 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    /* ── MOBILE ──────────────────────────────────────────── */
    @media (max-width: 500px) {
      header { padding: 10px 14px; }
      .header-title { font-size: 14px; }
      #grid { grid-template-columns: 1fr; }
      .tab { padding: 10px 11px; font-size: 12px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="logo">N</div>
    <div>
      <div class="header-title">NSL Intelligence Feed</div>
      <div class="header-sub">Near Space Labs · Competitive & Market News</div>
    </div>
  </div>
  <div class="header-right">
    <span id="last-updated"></span>
    <button id="refresh-btn" onclick="loadAll()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Refresh
    </button>
  </div>
</header>

<!-- TABS -->
<div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>

<!-- CONTENT -->
<main>
  <div class="alert alert-warn" id="err-banner">
    ⚠️ Some feeds didn't load. Results may be partial — try refreshing in a moment.
  </div>
  <div id="status"><div class="spinner"></div>Fetching latest news…</div>
  <div id="grid"></div>
</main>

<script>
// ─────────────────────────────────────────────────────────────
// FEED DEFINITIONS
// Each source is either:
//   { type:'gnews', query:'...' }         → Google News RSS via rss2json
//   { type:'rss',   url:'...' }           → Direct publisher RSS via allorigins
// ─────────────────────────────────────────────────────────────
const FEEDS = [
  {
    id: 'nsl', label: 'Near Space Labs',
    color: '#CC6847', bg: '#FDF2EC',
    sources: [
      { type:'gnews', query:'"Near Space Labs"' },
      { type:'gnews', query:'Near Space Labs Swift stratosphere balloon imaging' },
    ]
  },
  {
    id: 'competitors', label: 'Competitors',
    color: '#5C4E44', bg: '#F5F0E8',
    sources: [
      { type:'gnews', query:'Nearmap aerial imagery OR geospatial' },
      { type:'gnews', query:'EagleView aerial geospatial OR Vexcel Imaging' },
    ]
  },
  {
    id: 'general', label: 'General',
    color: '#3B6E8A', bg: '#EFF6FB',
    sources: [
      { type:'gnews', query:'"geospatial intelligence" OR GEOINT "earth observation" commercial' },
      { type:'gnews', query:'"commercial remote sensing" satellite imagery market Planet Labs OR Maxar OR Airbus' },
      { type:'gnews', query:'"earth observation" satellite imagery funding OR acquisition OR launch 2024 OR 2025' },
      { type:'gnews', query:'orthoimagery OR "aerial imagery" geospatial technology industry' },
      { type:'rss',   url:'https://geospatialworld.net/feed/' },
    ]
  },
  {
    id: 'insurance', label: 'P&C Insurance',
    color: '#2E6B50', bg: '#EDFAF4',
    sources: [
      { type:'gnews', query:'property insurance aerial imagery OR satellite imagery underwriting technology' },
      { type:'gnews', query:'insurtech "property risk" OR "roof inspection" OR "claims automation" 2024 OR 2025' },
      { type:'rss',   url:'https://www.insurancejournal.com/news/national/feed/' },
    ]
  },
  {
    id: 'government', label: 'Gov & Public Sector',
    color: '#7A2020', bg: '#FDF0F0',
    sources: [
      { type:'gnews', query:'government GIS geospatial aerial mapping state local procurement' },
      { type:'gnews', query:'"smart city" OR "urban planning" geospatial satellite technology' },
      { type:'rss',   url:'https://www.govtech.com/rss.xml' },
    ]
  },
  {
    id: 'energy', label: 'Energy & Utilities',
    color: '#8A4A1A', bg: '#FBF4EC',
    sources: [
      { type:'gnews', query:'utility aerial inspection "vegetation management" OR "grid monitoring" geospatial' },
      { type:'gnews', query:'energy infrastructure monitoring satellite OR aerial imaging technology' },
      { type:'rss',   url:'https://www.utilitydive.com/feeds/news/' },
    ]
  },
  {
    id: 'forestry', label: 'Forestry & Environment',
    color: '#2A6630', bg: '#EEF8EF',
    sources: [
      { type:'gnews', query:'wildfire detection forest monitoring aerial imagery OR satellite' },
      { type:'gnews', query:'"carbon offset" OR "carbon credit" forest verification remote sensing' },
      { type:'gnews', query:'environmental monitoring geospatial satellite "habitat" OR "biodiversity" 2024 OR 2025' },
    ]
  },
];

// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
let allArticles = [];
let activeTab   = 'all';
let isLoading   = false;

// ─────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────
function gnewsRssUrl(query) {
  return `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=en-US&gl=US&ceid=US:en`;
}

function rss2jsonUrl(rssUrl) {
  return `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&count=25`;
}

function alloriginsUrl(url) {
  return `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
}

function stripHtml(html) {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return (d.textContent || '').trim();
}

function cleanTitle(title) {
  // Google News appends " - Source Name" — strip it for cleaner display
  return title.replace(/\s[-–]\s[^-–]+$/, '').trim();
}

function extractSource(item) {
  // rss2json puts publisher in item.author for Google News
  if (item.author && !item.author.includes('@')) return item.author;
  try { return new URL(item.link || '').hostname.replace('www.',''); } catch { return ''; }
}

function relTime(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = Date.now() - d;
  const m = Math.floor(diff/60000);
  if (m < 90)  return `${m}m ago`;
  const h = Math.floor(m/60);
  if (h < 24)  return `${h}h ago`;
  const dy = Math.floor(h/24);
  if (dy < 8)  return `${dy}d ago`;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year: dy>365 ? 'numeric':undefined});
}

function dedup(articles) {
  const seen = new Set();
  return articles.filter(a => {
    const k = a.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,55);
    if (!k || seen.has(k)) return false;
    seen.add(k); return true;
  });
}

// ─────────────────────────────────────────────────────────────
// FETCH: rss2json (primary)
// ─────────────────────────────────────────────────────────────
async function fetchViaRss2json(rssUrl, feed) {
  const res  = await fetch(rss2jsonUrl(rssUrl), {signal: AbortSignal.timeout(8000)});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.status !== 'ok' || !Array.isArray(json.items)) throw new Error('bad response');
  return json.items.map(item => ({
    feedId:  feed.id, feed,
    title:   cleanTitle(item.title || ''),
    link:    item.link || item.guid || '#',
    source:  extractSource(item),
    date:    item.pubDate || '',
    excerpt: stripHtml(item.description || item.content || '').slice(0, 220),
  }));
}

// ─────────────────────────────────────────────────────────────
// FETCH: allorigins CORS proxy + XML parse (fallback)
// ─────────────────────────────────────────────────────────────
async function fetchViaAllorigins(rssUrl, feed) {
  const res  = await fetch(alloriginsUrl(rssUrl), {signal: AbortSignal.timeout(10000)});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  const xml  = json.contents || '';
  const doc  = new DOMParser().parseFromString(xml, 'application/xml');
  const items = Array.from(doc.querySelectorAll('item'));
  return items.slice(0, 25).map(el => {
    const getText = tag => el.querySelector(tag)?.textContent?.trim() || '';
    const link = getText('link') || el.querySelector('guid')?.textContent || '#';
    return {
      feedId:  feed.id, feed,
      title:   cleanTitle(getText('title')),
      link,
      source:  getText('source') || (new URL(rssUrl).hostname.replace('www.','')),
      date:    getText('pubDate'),
      excerpt: stripHtml(getText('description') || getText('content\\:encoded')).slice(0, 220),
    };
  }).filter(a => a.title);
}

// ─────────────────────────────────────────────────────────────
// FETCH ONE SOURCE  (tries rss2json, falls back to allorigins)
// ─────────────────────────────────────────────────────────────
async function fetchSource(source, feed) {
  const rssUrl = source.type === 'gnews'
    ? gnewsRssUrl(source.query)
    : source.url;

  try {
    return await fetchViaRss2json(rssUrl, feed);
  } catch (e) {
    // primary failed — try fallback
    try {
      return await fetchViaAllorigins(rssUrl, feed);
    } catch {
      return [];   // silent fail, partial results still show
    }
  }
}

// ─────────────────────────────────────────────────────────────
// LOAD ALL
// ─────────────────────────────────────────────────────────────
async function loadAll() {
  if (isLoading) return;
  isLoading = true;

  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  document.getElementById('status').classList.add('visible');
  document.getElementById('grid').innerHTML = '';
  document.getElementById('err-banner').classList.remove('visible');

  allArticles = [];
  let failures = 0;
  const total  = FEEDS.reduce((n, f) => n + f.sources.length, 0);

  // Fan out all fetches in parallel
  const tasks = FEEDS.flatMap(feed =>
    feed.sources.map(src =>
      fetchSource(src, feed).then(items => {
        allArticles.push(...items);
      }).catch(() => { failures++; })
    )
  );

  await Promise.allSettled(tasks);

  // Sort + deduplicate
  allArticles.sort((a, b) => new Date(b.date) - new Date(a.date));
  allArticles = dedup(allArticles);

  document.getElementById('status').classList.remove('visible');
  if (failures > total * 0.4) {
    document.getElementById('err-banner').classList.add('visible');
  }

  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

  renderTabs();
  renderGrid();
  btn.classList.remove('spinning');
  isLoading = false;
}

// ─────────────────────────────────────────────────────────────
// RENDER TABS
// ─────────────────────────────────────────────────────────────
function renderTabs() {
  const tabDefs = [
    { id:'all', label:'All', color:'#1A1511', count: allArticles.length },
    ...FEEDS.map(f => ({
      id: f.id, label: f.label, color: f.color,
      count: allArticles.filter(a => a.feedId === f.id).length
    }))
  ];
  document.getElementById('tabs').innerHTML = tabDefs.map(t => `
    <div class="tab ${t.id===activeTab?'active':''}" onclick="setTab('${t.id}')">
      <span class="tab-dot" style="background:${t.color}"></span>
      ${t.label}
      <span class="tab-count">${t.count}</span>
    </div>`).join('');
}

// ─────────────────────────────────────────────────────────────
// RENDER GRID
// ─────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('grid');
  const list = activeTab === 'all'
    ? allArticles
    : allArticles.filter(a => a.feedId === activeTab);

  if (!list.length) {
    grid.innerHTML = `<div class="empty"><span class="empty-icon">📭</span>No articles loaded yet — hit Refresh to try again.</div>`;
    return;
  }

  grid.innerHTML = list.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge" style="color:${a.feed.color};background:${a.feed.bg}">${a.feed.label}</span>
        <span class="card-src">${a.source}</span>
      </div>
      <div class="card-title"><a href="${a.link}" target="_blank" rel="noopener">${a.title}</a></div>
      ${a.excerpt ? `<div class="card-excerpt">${a.excerpt}</div>` : ''}
      <div class="card-foot">
        <span class="card-date">${relTime(a.date)}</span>
        <a class="read-link" href="${a.link}" target="_blank" rel="noopener">Read →</a>
      </div>
    </div>`).join('');
}

// ─────────────────────────────────────────────────────────────
// TAB SWITCH
// ─────────────────────────────────────────────────────────────
function setTab(id) {
  activeTab = id;
  renderTabs();
  renderGrid();
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
