// ---------- STATE ----------
let allArticles = [];
let activeTab = 'all';
let isLoading = false;

// ---------- FETCH (through Cloudflare Worker) ----------
async function fetchUrl(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(PROXY_BASE + encodeURIComponent(url), { signal: ctrl.signal });
    clearTimeout(t);
    if (!res.ok) throw new Error(res.status);
    return await res.text();
  } catch {
    clearTimeout(t);
    return '';
  }
}

// ---------- URL BUILDERS ----------
function bingNewsUrl(query) {
  return `https://www.bing.com/news/search?q=${encodeURIComponent(query)}&format=rss`;
}

// ---------- PARSING & HELPERS ----------
function stripHtml(html) {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return (d.textContent || '').trim();
}

function cleanTitle(t) {
  return (t || '').replace(/\s[-–]\s[^-–]{1,50}$/, '').trim();
}

function relTime(str) {
  const d = new Date(str);
  if (isNaN(d)) return '';
  const diff = Date.now() - d, m = Math.floor(diff / 60000);
  if (m < 90)  return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24)  return `${h}h ago`;
  const dy = Math.floor(h / 24);
  if (dy < 8)  return `${dy}d ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: dy > 300 ? 'numeric' : undefined });
}

function tsFor(a) {
  const t = new Date(a.date).getTime();
  return isNaN(t) ? 0 : t;
}

function dedup(arr) {
  const seen = new Set();
  return arr.filter(a => {
    const k = (a.title || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 60);
    if (!k || seen.has(k)) return false;
    seen.add(k); return true;
  });
}

function shouldFilter(source) {
  return source.tag === 'vertical';
}

function isRelevant(article) {
  const blob = `${article.title} ${article.excerpt}`.toLowerCase();
  return RELEVANCE_TERMS.some(term => blob.includes(term));
}

function isFresh(article) {
  const t = new Date(article.date).getTime();
  if (isNaN(t)) return true;
  return (Date.now() - t) <= MAX_AGE_MS;
}

// ---------- RSS / Bing News XML PARSER ----------
function parseXml(xmlStr, feed, feedUrl) {
  try {
    const doc = new DOMParser().parseFromString(xmlStr, 'application/xml');
    if (doc.querySelector('parsererror')) return [];
    const items = Array.from(doc.querySelectorAll('item'));
    if (!items.length) return [];

    return items.slice(0, 40).map(el => {
      const title = cleanTitle(el.querySelector('title')?.textContent?.trim() || '');
      if (!title || title.length < 6) return null;
      if (title === 'BLOCKED_BY_GOOGLE') return null; // safety check

      let link = el.querySelector('link')?.textContent?.trim() || '';
      if (!link || !link.startsWith('http')) {
        link = el.querySelector('guid')?.textContent?.trim() || '#';
      }

      let source = el.querySelector('source')?.textContent?.trim() || '';
      if (!source) {
        try { source = new URL(feedUrl).hostname.replace('www.', ''); } catch { source = feed.label; }
      }

      const date    = el.querySelector('pubDate')?.textContent?.trim() || '';
      const desc    = el.querySelector('description')?.textContent?.trim() || '';
      const excerpt = stripHtml(desc).slice(0, 220);
      return { feedId: feed.id, feed, title, link, source, date, excerpt };
    }).filter(Boolean);
  } catch {
    return [];
  }
}

// ---------- NSL PRESS PAGE PARSER ----------
// Scrapes nearspacelabs.com/press for the authoritative list of NSL coverage.
// The page is built with Webflow; press items are anchors with dates.
function parseNslPress(html, feed, feedUrl) {
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // Press items have a date string followed by publication name and title.
    // We look for anchors with external href that point to actual articles.
    const anchors = Array.from(doc.querySelectorAll('a[href^="http"]'));
    const externalArticles = anchors.filter(a => {
      const href = a.getAttribute('href') || '';
      const text = (a.textContent || '').trim();
      // Skip internal links and nav
      if (href.includes('nearspacelabs.com')) return false;
      if (href.includes('linkedin.com') || href.includes('twitter.com')) return false;
      // Must have meaningful text
      if (text.length < 15) return false;
      return true;
    });

    const seen = new Set();
    const results = [];
    for (const a of externalArticles) {
      const href = a.getAttribute('href');
      if (seen.has(href)) continue;
      seen.add(href);

      const fullText = (a.textContent || '').trim();
      // Try to split into publication + title (e.g. "TechCrunchNear Space Labs nabs $20M...")
      // Look for a date string nearby
      let publication = '';
      let title = fullText;

      // Look for date in parent or sibling text — Webflow renders dates as preceding text
      const parent = a.parentElement;
      const parentText = parent ? (parent.textContent || '') : '';
      const dateMatch = parentText.match(/(January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},?\s+\d{4}/);
      const dateStr = dateMatch ? dateMatch[0] : '';

      // Try to extract publication name (precedes title in concatenated text)
      const pubMatch = fullText.match(/^([A-Z][A-Za-z'\s&.]+?)([A-Z][^A-Z].+)$/);
      if (pubMatch && pubMatch[1].length < 40) {
        publication = pubMatch[1].trim();
        title = pubMatch[2].trim();
      }

      // Filter out social-link anchors and "See More" buttons
      if (title.length < 10 || title === 'See More' || title === 'Next') continue;
      // Trim trailing tags like "Article" or "Podcast"
      title = title.replace(/(Article|Podcast|Press Release|Video)$/, '').trim();

      results.push({
        feedId: feed.id,
        feed,
        title,
        link: href,
        source: publication || 'nearspacelabs.com/press',
        date: dateStr ? new Date(dateStr).toUTCString() : '',
        excerpt: 'Featured in Near Space Labs press coverage.',
      });
    }

    return results.slice(0, 25);
  } catch (e) {
    console.warn('NSL press parse error:', e);
    return [];
  }
}

// ---------- ROUTER ----------
async function fetchSource(source, feed) {
  let url;
  if (source.type === 'bing')      url = bingNewsUrl(source.query);
  else if (source.type === 'rss')  url = source.url;
  else if (source.type === 'nsl_press') url = source.url;
  else return [];

  const body = await fetchUrl(url);
  if (!body) return [];

  let parsed;
  if (source.type === 'nsl_press') {
    parsed = parseNslPress(body, feed, url);
  } else {
    parsed = parseXml(body, feed, url);
  }

  parsed = parsed.filter(isFresh);
  if (shouldFilter(source)) parsed = parsed.filter(isRelevant);
  return parsed;
}

// ---------- CACHE ----------
function readCache() {
  try {
    const raw = sessionStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !obj.savedAt || Date.now() - obj.savedAt > CACHE_TTL_MS) return null;
    const feedById = Object.fromEntries(FEEDS.map(f => [f.id, f]));
    obj.articles = (obj.articles || []).map(a => ({ ...a, feed: feedById[a.feedId] })).filter(a => a.feed);
    return obj;
  } catch {
    return null;
  }
}

function writeCache(articles) {
  try {
    const slim = articles.map(({ feed, ...rest }) => rest);
    sessionStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), articles: slim }));
  } catch {}
}

// ---------- LOAD ----------
async function loadAll(opts = {}) {
  if (isLoading) return;
  const { useCache = false } = opts;
  isLoading = true;

  const btn = document.getElementById('refresh-btn');
  const progressWrap = document.getElementById('progress-wrap');
  const progressBar = document.getElementById('progress-bar');
  const statusBar = document.getElementById('status-bar');
  const statusMsg = document.getElementById('status-msg');
  const cacheBadge = document.getElementById('cache-badge');

  if (useCache) {
    const cached = readCache();
    if (cached && cached.articles.length) {
      allArticles = cached.articles;
      cacheBadge.classList.add('visible');
      statusBar.style.display = 'flex';
      statusMsg.textContent = `${allArticles.length} articles · cached`;
      document.querySelector('.dot-loader').style.display = 'none';
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date(cached.savedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      renderTabs();
      renderGrid();
      isLoading = false;
      return;
    }
  }

  cacheBadge.classList.remove('visible');
  document.querySelector('.dot-loader').style.display = 'flex';
  btn.classList.add('spinning');
  progressWrap.classList.add('visible');
  progressBar.style.width = '4%';
  statusBar.style.display = 'flex';
  statusMsg.textContent = 'Fetching…';
  document.getElementById('grid').innerHTML = '';
  allArticles = [];

  const allSources = FEEDS.flatMap(feed => feed.sources.map(src => ({ src, feed })));
  const total = allSources.length;
  let done = 0;

  for (let i = 0; i < allSources.length; i += BATCH_SIZE) {
    const batch = allSources.slice(i, i + BATCH_SIZE);
    await Promise.allSettled(
      batch.map(({ src, feed }) =>
        fetchSource(src, feed).then(items => {
          allArticles.push(...items);
          done++;
          progressBar.style.width = `${Math.round((done / total) * 100)}%`;
          allArticles = dedup([...allArticles].sort((a, b) => tsFor(b) - tsFor(a)));
          statusMsg.textContent = `${done}/${total} sources · ${allArticles.length} articles`;
          renderTabs();
          renderGrid();
        })
      )
    );
  }

  writeCache(allArticles);

  progressWrap.classList.remove('visible');
  statusBar.style.display = 'none';
  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  btn.classList.remove('spinning');
  isLoading = false;
}

// ---------- RENDER ----------
function renderTabs() {
  const defs = [
    { id: 'all', label: 'All', color: '#1A1511', count: allArticles.length },
    ...FEEDS.filter(f => !f.hidden).map(f => ({
      id: f.id, label: f.label, color: f.color,
      count: allArticles.filter(a => a.feedId === f.id).length
    }))
  ];
  document.getElementById('tabs').innerHTML = defs.map(t => `
    <div class="tab ${t.id === activeTab ? 'active' : ''}" data-tab="${t.id}">
      <span class="tab-dot" style="background:${t.color}"></span>
      ${t.label}
      <span class="tab-count">${t.count}</span>
    </div>`).join('');
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const list = activeTab === 'all'
    ? allArticles
    : allArticles.filter(a => a.feedId === activeTab);

  if (!list.length) {
    const msg = isLoading
      ? 'Loading articles for this category…'
      : 'No articles found yet. Try refreshing in a moment.';
    grid.innerHTML = `<div class="empty"><span class="empty-icon">📭</span>${msg}</div>`;
    return;
  }

  grid.innerHTML = list.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge" style="color:${a.feed.color};background:${a.feed.bg}">${a.feed.label}</span>
        <span class="card-src">${a.source}</span>
      </div>
      <div class="card-title">
        <a href="${a.link}" target="_blank" rel="noopener">${a.title}</a>
      </div>
      ${a.excerpt ? `<div class="card-excerpt">${a.excerpt}</div>` : ''}
      <div class="card-foot">
        <span class="card-date">${relTime(a.date)}</span>
        <a class="read-link" href="${a.link}" target="_blank" rel="noopener">Read →</a>
      </div>
    </div>`).join('');
}

function setTab(id) {
  activeTab = id;
  renderTabs();
  renderGrid();
}

// ---------- EVENT WIRING ----------
document.getElementById('refresh-btn').addEventListener('click', () => {
  sessionStorage.removeItem(CACHE_KEY);
  loadAll({ useCache: false });
});
document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) setTab(tab.dataset.tab);
});

loadAll({ useCache: true });
</script>
</body>
