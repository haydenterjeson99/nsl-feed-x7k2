<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSL Intelligence Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FAF7F0; --cream-dark: #F0EBE1; --charcoal: #161210;
      --charcoal-mid: #2A2520; --terracotta: #CC6847; --terra-lt: #FDF2EC;
      --terra-dk: #A8502E; --text: #1A1511; --muted: #7A6E65;
      --border: #E5DFD5; --surface: #FFFFFF; --radius: 10px;
      --shadow: 0 1px 3px rgba(22,18,16,.07), 0 2px 8px rgba(22,18,16,.04);
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    header { background: var(--charcoal); color: #fff; padding: 14px 20px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #2E2825; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0; background: var(--terracotta); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -.5px; }
    .header-title { font-size: 16px; font-weight: 700; color: #F5F0EA; }
    .header-sub { font-size: 11px; color: #9E948A; margin-top: 1px; }
    .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #last-updated { font-size: 11px; color: #7A706A; }
    #refresh-btn { background: var(--charcoal-mid); color: #C8BEB4; border: 1px solid #3A3430; border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background .15s, color .15s; font-family: inherit; }
    #refresh-btn:hover { background: #3A3430; color: #F0EBE1; }
    #refresh-btn.spinning svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tabs-wrap { background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; position: sticky; top: 63px; z-index: 90; }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tabs { display: flex; padding: 0 16px; min-width: max-content; }
    .tab { padding: 11px 15px; font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; display: flex; align-items: center; gap: 7px; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--terracotta); border-bottom-color: var(--terracotta); }
    .tab-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .tab-count { background: var(--cream-dark); color: var(--muted); font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 20px; }

    main { max-width: 1120px; margin: 0 auto; padding: 22px 16px 60px; }

    #progress-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 18px; overflow: hidden; display: none; }
    #progress-wrap.visible { display: block; }
    #progress-bar { height: 100%; width: 4%; background: var(--terracotta); border-radius: 2px; transition: width .4s ease; }

    #status-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; min-height: 20px; }
    #status-msg { font-size: 12px; color: var(--muted); }
    #cache-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--terra-lt); color: var(--terra-dk); text-transform: uppercase; letter-spacing: .4px; display: none; }
    #cache-badge.visible { display: inline-block; }
    .dot-loader { display: flex; gap: 4px; }
    .dot-loader span { width: 5px; height: 5px; border-radius: 50%; background: var(--terracotta); animation: bounce 1.2s infinite; }
    .dot-loader span:nth-child(2) { animation-delay: .2s; }
    .dot-loader span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100% { transform: scale(.6); opacity:.4; } 40% { transform: scale(1); opacity:1; } }

    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 17px; display: flex; flex-direction: column; gap: 9px; transition: box-shadow .15s, transform .15s; animation: fadeUp .25s ease; }
    @keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: none; } }
    .card:hover { box-shadow: 0 4px 18px rgba(22,18,16,.10); transform: translateY(-1px); }
    .card-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .badge { font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; }
    .card-src { font-size: 11px; color: var(--muted); margin-left: auto; font-weight: 500; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-title { font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text); }
    .card-title a { color: inherit; text-decoration: none; }
    .card-title a:hover { color: var(--terracotta); }
    .card-excerpt { font-size: 13px; color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
    .card-date { font-size: 11px; color: var(--muted); }
    .read-link { font-size: 12px; font-weight: 600; color: var(--terracotta); text-decoration: none; }
    .read-link:hover { color: var(--terra-dk); }

    .empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
    .empty-icon { font-size: 32px; display: block; margin-bottom: 10px; }

    @media (max-width: 500px) {
      header { padding: 10px 14px; }
      .header-title { font-size: 14px; }
      #grid { grid-template-columns: 1fr; }
      .tab { padding: 10px 11px; font-size: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">N</div>
    <div>
      <div class="header-title">NSL Intelligence Feed</div>
      <div class="header-sub">Near Space Labs · Competitive & Market Intelligence</div>
    </div>
  </div>
  <div class="header-right">
    <span id="last-updated"></span>
    <button id="refresh-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Refresh
    </button>
  </div>
</header>

<div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>

<main>
  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <div id="status-bar" style="display:none">
    <div class="dot-loader"><span></span><span></span><span></span></div>
    <span id="status-msg">Loading…</span>
    <span id="cache-badge">cached</span>
  </div>
  <div id="grid"></div>
</main>

<script>
// ---------- CONFIG ----------
const CACHE_KEY = 'nsl_feed_cache_v3';
const CACHE_TTL_MS = 10 * 60 * 1000;  // 10 minutes
const FETCH_TIMEOUT_MS = 9000;
const BATCH_SIZE = 12;

// Relevance keyword list — used ONLY to filter Google News results, not RSS feeds.
// RSS feeds from curated trade publications are trusted as already on-topic.
const INDUSTRY_TERMS = [
  'aerial', 'satellite', 'geospatial', 'imagery', 'remote sensing',
  'earth observation', 'drone', 'uav', 'lidar', 'gis', 'mapping',
  'orthoimagery', 'stratosphere', 'stratospheric', 'high altitude',
  'overhead', 'photogrammetry', 'geoint', 'eagleview', 'nearmap',
  'vexcel', 'maxar', 'planet labs', 'blacksky', 'near space labs',
  'roof inspection', 'vegetation management', 'aerial inspection',
  'aerial survey', 'aerial photography', 'aerial data', 'aerial mapping',
  'satellite imagery', 'wildfire', 'deforestation', 'forest monitoring',
  'crop monitoring', 'precision agriculture', 'land use', 'land cover',
  'spatial data', 'cartography', 'orthophoto', 'mosaic', 'airborne',
  'surveying', 'topograph', 'elevation model', 'dem', 'dsm', 'point cloud'
];

const FEEDS = [
  {
    id: 'nsl', label: 'Near Space Labs', color: '#CC6847', bg: '#FDF2EC',
    sources: [
      { type: 'gnews', query: '"Near Space Labs"', bypassRelevance: true },
      { type: 'gnews', query: '"Near Space Labs" Swift OR balloon OR stratosphere', bypassRelevance: true },
    ]
  },
  {
    id: 'competitors', label: 'Competitors', color: '#5C4E44', bg: '#F5F0E8',
    sources: [
      // Named competitor queries — name match is sufficient relevance signal
      { type: 'gnews', query: 'Nearmap', bypassRelevance: true },
      { type: 'gnews', query: 'EagleView OR Vexcel', bypassRelevance: true },
      { type: 'gnews', query: '(Maxar OR "Planet Labs" OR BlackSky) -stock -earnings', bypassRelevance: true },
    ]
  },
  {
    id: 'general', label: 'General', hidden: true, color: '#3B6E8A', bg: '#EFF6FB',
    sources: [
      { type: 'gnews', query: '"earth observation" commercial imagery' },
      { type: 'gnews', query: 'geospatial remote sensing aerial' },
      { type: 'rss', url: 'https://geospatialworld.net/feed/' },
      { type: 'rss', url: 'https://www.gim-international.com/rss.xml' },
    ]
  },
  {
    id: 'insurance', label: 'P&C Insurance', color: '#2E6B50', bg: '#EDFAF4',
    sources: [
      { type: 'rss', url: 'https://insuranceinnovationreporter.com/feed/' },
      { type: 'gnews', query: 'property insurance aerial OR satellite imagery roof' },
      { type: 'gnews', query: 'catastrophe modeling insurtech "property risk"' },
    ]
  },
  {
    id: 'government', label: 'Gov & Public Sector', color: '#7A2020', bg: '#FDF0F0',
    sources: [
      { type: 'rss', url: 'https://www.govtech.com/rss.xml' },
      { type: 'rss', url: 'https://statetechmagazine.com/rss.xml' },
      { type: 'gnews', query: 'government GIS aerial imagery emergency management' },
    ]
  },
  {
    id: 'energy', label: 'Energy & Utilities', color: '#8A4A1A', bg: '#FBF4EC',
    sources: [
      { type: 'rss', url: 'https://www.utilitydive.com/feeds/news/' },
      { type: 'rss', url: 'https://www.tdworld.com/rss/all' },
      { type: 'gnews', query: 'utility "vegetation management" OR "aerial inspection" grid' },
    ]
  },
  {
    id: 'forestry', label: 'Forestry & Environment', color: '#2A6630', bg: '#EEF8EF',
    sources: [
      { type: 'rss', url: 'https://news.mongabay.com/feed/' },
      { type: 'rss', url: 'https://www.carbonbrief.org/feed/' },
      { type: 'gnews', query: 'wildfire OR deforestation aerial OR satellite monitoring' },
    ]
  },
];

// ---------- STATE ----------
let allArticles = [];
let activeTab = 'all';
let isLoading = false;

// ---------- FETCH (3-proxy race) ----------
async function fetchXml(url) {
  const proxies = [
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  ];
  const attempt = (proxyUrl) => {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
    return fetch(proxyUrl, { signal: ctrl.signal })
      .then(res => { clearTimeout(t); if (!res.ok) throw new Error(res.status); return res.text(); })
      .catch(e  => { clearTimeout(t); throw e; });
  };
  try {
    return await Promise.any(proxies.map(attempt));
  } catch {
    return '';
  }
}

// ---------- URL BUILDERS ----------
function gnewsUrl(query) {
  // when:14d gives a 2-week window — wide enough for niche topics, narrow enough to stay fresh
  const q = `${query} when:14d`;
  return `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=en-US&gl=US&ceid=US:en`;
}

// ---------- PARSING & HELPERS ----------
function stripHtml(html) {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return (d.textContent || '').trim();
}

function cleanTitle(t) {
  return (t || '').replace(/\s[-–]\s[^-–]{1,50}$/, '').trim();
}

function relTime(str) {
  const d = new Date(str);
  if (isNaN(d)) return '';
  const diff = Date.now() - d, m = Math.floor(diff / 60000);
  if (m < 90)  return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24)  return `${h}h ago`;
  const dy = Math.floor(h / 24);
  if (dy < 8)  return `${dy}d ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: dy > 300 ? 'numeric' : undefined });
}

function tsFor(a) {
  const t = new Date(a.date).getTime();
  return isNaN(t) ? 0 : t;
}

function dedup(arr) {
  const seen = new Set();
  return arr.filter(a => {
    const k = (a.title || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 60);
    if (!k || seen.has(k)) return false;
    seen.add(k); return true;
  });
}

// Relevance is now per-SOURCE, not per-feed. RSS feeds skip it entirely;
// Google News queries get filtered unless explicitly marked bypassRelevance.
function shouldFilter(source) {
  if (source.type === 'rss') return false;
  if (source.bypassRelevance) return false;
  return true;
}

function isRelevant(article) {
  const blob = `${article.title} ${article.excerpt}`.toLowerCase();
  return INDUSTRY_TERMS.some(term => blob.includes(term));
}

function parseXml(xmlStr, feed, feedUrl) {
  try {
    const doc = new DOMParser().parseFromString(xmlStr, 'application/xml');
    if (doc.querySelector('parsererror')) return [];
    const items = Array.from(doc.querySelectorAll('item'));
    if (!items.length) return [];
    return items.slice(0, 40).map(el => {
      const title = cleanTitle(el.querySelector('title')?.textContent?.trim() || '');
      if (!title || title.length < 6) return null;

      let link = '';
      const linkEl = el.querySelector('link');
      if (linkEl) {
        link = linkEl.textContent?.trim() || '';
        if (!link || !link.startsWith('http')) {
          const ns = linkEl.nextSibling;
          if (ns && ns.nodeType === 3) link = ns.textContent?.trim() || '';
        }
      }
      if (!link || !link.startsWith('http')) {
        link = el.querySelector('guid')?.textContent?.trim() || '#';
      }

      let source = el.querySelector('source')?.textContent?.trim() || '';
      if (!source) {
        try { source = new URL(feedUrl).hostname.replace('www.', ''); } catch { source = feed.label; }
      }
      const date    = el.querySelector('pubDate')?.textContent?.trim() || '';
      const desc    = el.querySelector('description')?.textContent?.trim() || '';
      const excerpt = stripHtml(desc).slice(0, 220);
      return { feedId: feed.id, feed, title, link, source, date, excerpt };
    }).filter(Boolean);
  } catch {
    return [];
  }
}

async function fetchSource(source, feed) {
  const url = source.type === 'gnews' ? gnewsUrl(source.query) : source.url;
  const xml = await fetchXml(url);
  if (!xml) return [];
  let parsed = parseXml(xml, feed, url);
  if (shouldFilter(source)) {
    parsed = parsed.filter(isRelevant);
  }
  return parsed;
}

// ---------- CACHE ----------
function readCache() {
  try {
    const raw = sessionStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !obj.savedAt || Date.now() - obj.savedAt > CACHE_TTL_MS) return null;
    const feedById = Object.fromEntries(FEEDS.map(f => [f.id, f]));
    obj.articles = (obj.articles || []).map(a => ({ ...a, feed: feedById[a.feedId] })).filter(a => a.feed);
    return obj;
  } catch {
    return null;
  }
}

function writeCache(articles) {
  try {
    const slim = articles.map(({ feed, ...rest }) => rest);
    sessionStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), articles: slim }));
  } catch {}
}

// ---------- LOAD ----------
async function loadAll(opts = {}) {
  if (isLoading) return;
  const { useCache = false } = opts;
  isLoading = true;

  const btn = document.getElementById('refresh-btn');
  const progressWrap = document.getElementById('progress-wrap');
  const progressBar = document.getElementById('progress-bar');
  const statusBar = document.getElementById('status-bar');
  const statusMsg = document.getElementById('status-msg');
  const cacheBadge = document.getElementById('cache-badge');

  if (useCache) {
    const cached = readCache();
    if (cached && cached.articles.length) {
      allArticles = cached.articles;
      cacheBadge.classList.add('visible');
      statusBar.style.display = 'flex';
      statusMsg.textContent = `${allArticles.length} articles · cached`;
      document.querySelector('.dot-loader').style.display = 'none';
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date(cached.savedAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      renderTabs();
      renderGrid();
      isLoading = false;
      return;
    }
  }

  cacheBadge.classList.remove('visible');
  document.querySelector('.dot-loader').style.display = 'flex';
  btn.classList.add('spinning');
  progressWrap.classList.add('visible');
  progressBar.style.width = '4%';
  statusBar.style.display = 'flex';
  statusMsg.textContent = 'Fetching…';
  document.getElementById('grid').innerHTML = '';
  allArticles = [];

  const allSources = FEEDS.flatMap(feed => feed.sources.map(src => ({ src, feed })));
  const total = allSources.length;
  let done = 0;

  for (let i = 0; i < allSources.length; i += BATCH_SIZE) {
    const batch = allSources.slice(i, i + BATCH_SIZE);
    await Promise.allSettled(
      batch.map(({ src, feed }) =>
        fetchSource(src, feed).then(items => {
          allArticles.push(...items);
          done++;
          progressBar.style.width = `${Math.round((done / total) * 100)}%`;
          allArticles = dedup([...allArticles].sort((a, b) => tsFor(b) - tsFor(a)));
          statusMsg.textContent = `${done}/${total} sources · ${allArticles.length} articles`;
          renderTabs();
          renderGrid();
        })
      )
    );
  }

  writeCache(allArticles);

  progressWrap.classList.remove('visible');
  statusBar.style.display = 'none';
  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  btn.classList.remove('spinning');
  isLoading = false;
}

// ---------- RENDER ----------
function renderTabs() {
  const defs = [
    { id: 'all', label: 'All', color: '#1A1511', count: allArticles.length },
    ...FEEDS.filter(f => !f.hidden).map(f => ({
      id: f.id, label: f.label, color: f.color,
      count: allArticles.filter(a => a.feedId === f.id).length
    }))
  ];
  document.getElementById('tabs').innerHTML = defs.map(t => `
    <div class="tab ${t.id === activeTab ? 'active' : ''}" data-tab="${t.id}">
      <span class="tab-dot" style="background:${t.color}"></span>
      ${t.label}
      <span class="tab-count">${t.count}</span>
    </div>`).join('');
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const list = activeTab === 'all'
    ? allArticles
    : allArticles.filter(a => a.feedId === activeTab);

  if (!list.length) {
    const msg = isLoading
      ? 'Loading articles for this category…'
      : 'No articles found. Try refreshing.';
    grid.innerHTML = `<div class="empty"><span class="empty-icon">📭</span>${msg}</div>`;
    return;
  }

  grid.innerHTML = list.map(a => `
    <div class="card">
      <div class="card-top">
        <span class="badge" style="color:${a.feed.color};background:${a.feed.bg}">${a.feed.label}</span>
        <span class="card-src">${a.source}</span>
      </div>
      <div class="card-title">
        <a href="${a.link}" target="_blank" rel="noopener">${a.title}</a>
      </div>
      ${a.excerpt ? `<div class="card-excerpt">${a.excerpt}</div>` : ''}
      <div class="card-foot">
        <span class="card-date">${relTime(a.date)}</span>
        <a class="read-link" href="${a.link}" target="_blank" rel="noopener">Read →</a>
      </div>
    </div>`).join('');
}

function setTab(id) {
  activeTab = id;
  renderTabs();
  renderGrid();
}

// ---------- EVENT WIRING ----------
document.getElementById('refresh-btn').addEventListener('click', () => {
  sessionStorage.removeItem(CACHE_KEY); // force fresh fetch
  loadAll({ useCache: false });
});
document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) setTab(tab.dataset.tab);
});

loadAll({ useCache: true });
</script>
</body>
</html>
